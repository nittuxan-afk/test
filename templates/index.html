<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬予想</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: linear-gradient(160deg, #0d2b0d 0%, #1a5c1a 60%, #2d7a2d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo .icon { font-size: 56px; display: block; }
    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      color: #0d2b0d;
      letter-spacing: 0.05em;
      margin-top: 8px;
    }
    .logo p {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 17px;
      font-family: monospace;
      letter-spacing: 0.08em;
      transition: border-color .2s;
      outline: none;
    }
    input[type="text"]:focus { border-color: #1a5c1a; }
    input[type="text"]::placeholder { color: #bbb; font-size: 14px; letter-spacing: 0; }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }
    .hint code {
      background: #f4f4f4;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #f8f8f8;
      border-radius: 10px;
      cursor: pointer;
    }
    .check-row input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: #1a5c1a;
      cursor: pointer;
    }
    .check-row span {
      font-size: 14px;
      color: #444;
    }
    .check-row small { color: #888; }

    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #1a5c1a, #2d8a2d);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity .2s, transform .1s;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:active { transform: scale(0.99); }

    .error-box {
      background: #ffeaea;
      border: 1px solid #f5a0a0;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 14px;
      color: #c0392b;
      margin-bottom: 20px;
    }

    .venue-table {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }
    .venue-table p { font-size: 12px; color: #888; margin-bottom: 10px; }
    .venue-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .venue-chip {
      background: #f0f7f0;
      border: 1px solid #c8e6c9;
      border-radius: 6px;
      padding: 5px;
      text-align: center;
      font-size: 11px;
      color: #2d5a2d;
      line-height: 1.4;
    }
    .venue-chip strong { display: block; font-size: 13px; }

    /* Loading overlay */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p { color: #fff; font-size: 18px; font-weight: 600; }
    #loading small { color: rgba(255,255,255,0.65); font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <span class="icon">🏇</span>
    <h1>競馬予想</h1>
    <p>netkeiba のデータをもとにスコアリング予想</p>
  </div>

  {% if error %}
  <div class="error-box">⚠️ {{ error }}</div>
  {% endif %}

  <form action="/predict" method="POST" id="form">
    <div class="form-group">
      <label for="race_id">レースID</label>
      <input
        type="text"
        id="race_id"
        name="race_id"
        placeholder="例: 202506050811"
        value="{{ prev_race_id or '' }}"
        maxlength="12"
        required
        autofocus
      >
      <p class="hint">
        12桁: <code>YYYY</code>(年) + <code>競馬場</code> + <code>開催回</code> + <code>日数</code> + <code>R番号</code><br>
        netkeiba の URL から確認できます
      </p>
    </div>

    <div class="form-group">
      <label class="check-row" for="no_history">
        <input type="checkbox" id="no_history" name="no_history" value="1">
        <span>高速モード <small>（過去成績を取得しない・精度低下）</small></span>
      </label>
    </div>

    <button type="submit">予想する →</button>
  </form>

  <div class="venue-table">
    <p>主な競馬場コード</p>
    <div class="venue-grid">
      <div class="venue-chip"><strong>05</strong>東京</div>
      <div class="venue-chip"><strong>06</strong>中山</div>
      <div class="venue-chip"><strong>08</strong>京都</div>
      <div class="venue-chip"><strong>09</strong>阪神</div>
      <div class="venue-chip"><strong>10</strong>小倉</div>
      <div class="venue-chip"><strong>01</strong>札幌</div>
      <div class="venue-chip"><strong>02</strong>函館</div>
      <div class="venue-chip"><strong>03</strong>福島</div>
      <div class="venue-chip"><strong>04</strong>新潟</div>
      <div class="venue-chip"><strong>07</strong>中京</div>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p>予想中...</p>
  <small>出走馬の過去成績を取得しています。しばらくお待ちください。</small>
</div>

<script>
  document.getElementById('form').addEventListener('submit', function() {
    document.getElementById('loading').classList.add('show');
  });
</script>
</body>
</html>
